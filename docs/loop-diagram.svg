<svg width="680" height="1100" viewBox="0 0 680 1100" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<title>The crosscheck loop shown as three feedback cycles, not a one-way pipeline</title>
<desc>A vertical flow from Brief through Draft, a Direction gate, the Argument critic, Critics, Lead judges, a Ledger and honesty guard, the Judge panel at the freeze, to Ship. Three dashed loop-back arrows show the actual repetition: the Direction gate loops back to Draft on structural feedback, Lead judges loops back to Critics until both approve the same unchanged final, and a fix or rethink verdict from the Judge panel voids the clean pass and loops back to Critics.</desc>
<rect x="0" y="0" width="680" height="1100" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<!-- main flow -->
<rect x="260" y="60" width="160" height="50" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="81" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">Brief</text>
<text x="340" y="98" text-anchor="middle" font-size="12" fill="#5F5E5A">shared context</text>
<line x1="340" y1="110" x2="340" y2="170" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="260" y="170" width="160" height="50" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="191" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">Draft</text>
<text x="340" y="208" text-anchor="middle" font-size="12" fill="#5F5E5A">fanned-out workers</text>
<line x1="340" y1="220" x2="340" y2="280" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="260" y="280" width="160" height="50" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="301" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Direction gate</text>
<text x="340" y="318" text-anchor="middle" font-size="12" fill="#534AB7">principal reviews</text>
<line x1="340" y1="330" x2="340" y2="390" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="350" y="363" text-anchor="start" font-size="12" fill="#5F5E5A">gate clears</text>

<path d="M420,305 C500,305 500,195 420,195" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="505" y="253" text-anchor="start" font-size="12" fill="#534AB7">direction loop</text>

<rect x="260" y="390" width="160" height="50" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="411" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Argument critic</text>
<text x="340" y="428" text-anchor="middle" font-size="12" fill="#0F6E56">spine before correctness</text>
<line x1="340" y1="440" x2="340" y2="500" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="350" y="473" text-anchor="start" font-size="12" fill="#5F5E5A">lead restructures</text>

<rect x="260" y="500" width="160" height="50" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="521" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Critics</text>
<text x="340" y="538" text-anchor="middle" font-size="12" fill="#0F6E56">cross-family audit</text>
<line x1="340" y1="550" x2="340" y2="610" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="260" y="610" width="160" height="50" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="631" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Lead judges</text>
<text x="340" y="648" text-anchor="middle" font-size="12" fill="#993C1D">applies findings</text>
<line x1="340" y1="660" x2="340" y2="720" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="350" y="693" text-anchor="start" font-size="12" fill="#5F5E5A">both critics approve</text>

<path d="M420,635 C500,635 500,525 420,525" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="505" y="583" text-anchor="start" font-size="12" fill="#0F6E56">convergence loop</text>

<rect x="230" y="720" width="220" height="50" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="741" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">Ledger + honesty guard</text>
<text x="340" y="758" text-anchor="middle" font-size="12" fill="#5F5E5A">proved and honest status</text>
<line x1="340" y1="770" x2="340" y2="830" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="240" y="830" width="200" height="50" rx="4" fill="#FBF3DC" stroke="#96731B" stroke-width="0.5"/>
<text x="340" y="851" text-anchor="middle" font-size="14" font-weight="500" fill="#6B5210">Judge panel</text>
<text x="340" y="868" text-anchor="middle" font-size="12" fill="#96731B">freeze: ship / fix / rethink</text>
<line x1="340" y1="880" x2="340" y2="940" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="350" y="913" text-anchor="start" font-size="12" fill="#5F5E5A">panel says ship</text>

<path d="M440,855 C590,855 590,515 420,515" fill="none" stroke="#96731B" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="545" y="695" text-anchor="middle" font-size="12" fill="#96731B">fix / rethink</text>
<text x="545" y="710" text-anchor="middle" font-size="12" fill="#96731B">voids the pass</text>

<rect x="260" y="940" width="160" height="50" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="340" y="961" text-anchor="middle" font-size="14" font-weight="500" fill="#27500A">Ship</text>
<text x="340" y="978" text-anchor="middle" font-size="12" fill="#3B6D11">gates cleared</text>

<!-- legend -->
<rect x="24" y="1048" width="12" height="12" rx="2" fill="#888780"/><text x="40" y="1058" text-anchor="start" font-size="12" fill="#5F5E5A">worker</text>
<rect x="120" y="1048" width="12" height="12" rx="2" fill="#7F77DD"/><text x="136" y="1058" text-anchor="start" font-size="12" fill="#5F5E5A">principal gate</text>
<rect x="250" y="1048" width="12" height="12" rx="2" fill="#1D9E75"/><text x="266" y="1058" text-anchor="start" font-size="12" fill="#5F5E5A">critics</text>
<rect x="340" y="1048" width="12" height="12" rx="2" fill="#D85A30"/><text x="356" y="1058" text-anchor="start" font-size="12" fill="#5F5E5A">lead</text>
<rect x="420" y="1048" width="12" height="12" rx="2" fill="#C9A227"/><text x="436" y="1058" text-anchor="start" font-size="12" fill="#5F5E5A">judge panel (freeze)</text>
<rect x="580" y="1048" width="12" height="12" rx="2" fill="#639922"/><text x="596" y="1058" text-anchor="start" font-size="12" fill="#5F5E5A">ship</text>
</svg>
